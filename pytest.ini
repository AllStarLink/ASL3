[pytest]
# pytest configuration for ASL3 tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    stable: Core tests that are fully working (pass reliably)
    integration: Integration tests requiring subprocess/socket mocking
    slow: Tests that take significant time to run
    requires_asterisk: Tests that require asterisk to be running

# Test collection options
addopts = 
    -v
    --tb=short
    --strict-markers

# Minimum Python version
minversion = 3.11
